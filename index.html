<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진로탄력성 드라이브: 왜 내비게이션인가?</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --card-border: #2a374e;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-orange: #fb923c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            background: rgba(251, 146, 60, 0.15);
            color: var(--accent-orange);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(251, 146, 60, 0.3);
            margin-bottom: 12px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* 퀴즈 섹션 */
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 24px 0;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: left;
        }

        .option-card:hover {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
        }

        .option-card.selected-wrong {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        .option-card.selected-right {
            border-color: var(--accent-green);
            background: rgba(74, 222, 128, 0.1);
        }

        .option-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .option-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .feedback-box {
            display: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-wrong {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #fca5a5;
        }

        .feedback-right {
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #86efac;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: #334155;
            color: #64748b;
            font-size: 16px;
            font-weight: 700;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }

        .action-btn.active {
            background: var(--accent-blue);
            color: #0f172a;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
        }

        .action-btn.active:hover {
            transform: translateY(-2px);
        }

        /* 시뮬레이터 단계 */
        .stage-view {
            display: none;
        }

        .stage-view.active {
            display: block;
        }

        .pillars-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        @media (max-width: 500px) {
            .pillars-grid {
                grid-template-columns: 1fr;
            }
        }

        .pillar-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pillar-card:hover, .pillar-card.active {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.08);
        }

        .pillar-num {
            color: var(--accent-orange);
            font-size: 12px;
            font-weight: 700;
        }

        .pillar-name {
            font-size: 16px;
            font-weight: 700;
            margin: 4px 0;
        }

        .pillar-en {
            font-size: 11px;
            color: var(--text-secondary);
        }
